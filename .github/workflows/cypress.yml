name: Shaba Search Cypress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cypress/**'
      - 'cypress.config.js'
      - 'package.json'
      - '.github/workflows/cypress.yml'

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cypress
        run: npm install --no-audit --no-fund

      - name: Run Cypress against Shopify preview
        run: npx cypress run --browser chrome

      - name: Upload Cypress failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-artifacts
          if-no-files-found: ignore
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
